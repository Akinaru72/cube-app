<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/favicon.svg"> -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cube-app</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="header">
      <a href="#" class="logo" id="logo">
        <img
          src="./public/logoCube.png"
          alt="CubeSolver3D logo"
          class="logo-img"
        />
        <span>CubeSolver3D</span>
      </a>
      <!-- <a href="#" class="logo" id="logo"> 🧊 CubeSolver3D </a> -->

      <nav class="main-nav">
        <button type="button" class="menu-btn" id="description-btn">
          Description
        </button>

        <button type="button" class="menu-btn" id="settings-btn">
          Settings
        </button>

        <button type="button" class="menu-btn" id="guide-btn">Guide</button>

        <button type="button" class="menu-btn" id="help-btn">Help</button>
      </nav>
    </header>

    <main class="main-content">
      <div id="cube-container"></div>
      <nav class="cube-controls">
        <button type="button" class="control-btn" id="reset-btn">START</button>

        <button type="button" class="control-btn" id="scramble-btn">
          SCRAMBLE
        </button>

        <button type="button" class="control-btn" id="solve-btn">SOLVE</button>

        <button type="button" class="control-btn" id="undo-btn">UNDO</button>

        <button type="button" class="control-btn" id="redo-btn">REDO</button>
      </nav>
    </main>

    <footer class="footer"></footer>
    <script src="./main.js" type="module" defer></script>
  </body>
</html>
